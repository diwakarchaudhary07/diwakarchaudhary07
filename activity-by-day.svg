<svg width="700" height="390" viewBox="0 0 700 390"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="700" height="390" rx="14"
        fill="#061526" stroke="#23496d" stroke-width="2"/>

  <!-- Title -->
  <text x="40" y="52"
        fill="#f5f7fa"
        font-size="25"
        font-family="Arial"
        font-weight="bold">
    Activity by Day of Week
  </text>

  <!-- Grid -->
  <line x1="70" y1="95" x2="660" y2="95"
        stroke="#23496d"/>
  <line x1="70" y1="145" x2="660" y2="145"
        stroke="#23496d"/>
  <line x1="70" y1="195" x2="660" y2="195"
        stroke="#23496d"/>
  <line x1="70" y1="245" x2="660" y2="245"
        stroke="#23496d"/>
  <line x1="70" y1="295" x2="660" y2="295"
        stroke="#23496d"/>

  <!-- Y Axis -->
  <text x="35" y="101" fill="#dbe7f5" font-size="14">50</text>
  <text x="35" y="151" fill="#dbe7f5" font-size="14">40</text>
  <text x="35" y="201" fill="#dbe7f5" font-size="14">30</text>
  <text x="35" y="251" fill="#dbe7f5" font-size="14">20</text>
  <text x="35" y="301" fill="#dbe7f5" font-size="14">0</text>

  <!-- Bars -->

  <!-- Monday -->
  <rect x="85" y="155" width="55" height="140"
        rx="4" fill="#287cff"/>
  <text x="103" y="145" fill="#f5f7fa"
        font-size="15">28</text>

  <!-- Tuesday -->
  <rect x="165" y="135" width="55" height="160"
        rx="4" fill="#21d18b"/>
  <text x="183" y="125" fill="#f5f7fa"
        font-size="15">32</text>

  <!-- Wednesday -->
  <rect x="245" y="75" width="55" height="220"
        rx="4" fill="#7747e8"/>
  <text x="263" y="65" fill="#f5f7fa"
        font-size="15">45</text>

  <!-- Thursday -->
  <rect x="325" y="105" width="55" height="190"
        rx="4" fill="#ff9d32"/>
  <text x="343" y="95" fill="#f5f7fa"
        font-size="15">38</text>

  <!-- Friday -->
  <rect x="405" y="140" width="55" height="155"
        rx="4" fill="#f04b5d"/>
  <text x="423" y="130" fill="#f5f7fa"
        font-size="15">31</text>

  <!-- Saturday -->
  <rect x="485" y="185" width="55" height="110"
        rx="4" fill="#19bce8"/>
  <text x="503" y="175" fill="#f5f7fa"
        font-size="15">22</text>

  <!-- Sunday -->
  <rect x="565" y="215" width="55" height="80"
        rx="4" fill="#e843a8"/>
  <text x="583" y="205" fill="#f5f7fa"
        font-size="15">16</text>

  <!-- Labels -->
  <text x="95"  y="325" fill="#dbe7f5" font-size="15">Mon</text>
  <text x="175" y="325" fill="#dbe7f5" font-size="15">Tue</text>
  <text x="255" y="325" fill="#dbe7f5" font-size="15">Wed</text>
  <text x="335" y="325" fill="#dbe7f5" font-size="15">Thu</text>
  <text x="415" y="325" fill="#dbe7f5" font-size="15">Fri</text>
  <text x="495" y="325" fill="#dbe7f5" font-size="15">Sat</text>
  <text x="575" y="325" fill="#dbe7f5" font-size="15">Sun</text>

</svg>
